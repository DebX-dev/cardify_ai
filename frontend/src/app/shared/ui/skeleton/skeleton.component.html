<div class="grid grid-cols-1 md:grid-cols-3 gap-6" aria-busy="true" aria-label="Generating product variants">
  @for (item of [1, 2, 3]; track item) {
    <div class="glass-panel rounded-2xl p-6 space-y-4 animate-pulse">
      <div class="flex items-center justify-between">
        <div class="h-6 w-24 rounded-full bg-slate-300/60 dark:bg-slate-700/60"></div>
        <div class="h-12 w-12 rounded-full bg-slate-300/60 dark:bg-slate-700/60"></div>
      </div>
      <div class="h-6 w-4/5 rounded-lg bg-slate-300/60 dark:bg-slate-700/60"></div>
      <div class="space-y-2">
        <div class="h-4 w-full rounded bg-slate-300/50 dark:bg-slate-700/50"></div>
        <div class="h-4 w-5/6 rounded bg-slate-300/50 dark:bg-slate-700/50"></div>
      </div>
      <div class="flex gap-2 pt-2">
        <div class="h-5 w-16 rounded-full bg-slate-300/50 dark:bg-slate-700/50"></div>
        <div class="h-5 w-20 rounded-full bg-slate-300/50 dark:bg-slate-700/50"></div>
        <div class="h-5 w-14 rounded-full bg-slate-300/50 dark:bg-slate-700/50"></div>
      </div>
    </div>
  }
</div>
