<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  [class]="buttonClasses()"
>
  @if (loading()) {
    <span
      class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"
      aria-hidden="true"
    ></span>
  }
  <ng-content />
</button>
